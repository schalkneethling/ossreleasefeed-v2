name = "ossreleasefeed-worker"
main = "src/index.ts"
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
workers_dev = true

# Secrets are never stored here. The Jev interpreter's TYPESAFE_API_KEY is a
# Worker secret in production: `wrangler secret put TYPESAFE_API_KEY`.
[vars]
APP_NAME = "ossreleasefeed"

[ai]
binding = "AI"
remote = true

[[flagship]]
binding = "FLAGS"
app_id = "eabc32c1-78e1-4148-8e00-0be4fd5cb1ed"
remote = true

[[ratelimits]]
name = "ASSISTANT_CLIENT_RATE_LIMITER"
namespace_id = "762019481"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "ASSISTANT_NETWORK_RATE_LIMITER"
namespace_id = "762019482"

[ratelimits.simple]
limit = 15
period = 60
