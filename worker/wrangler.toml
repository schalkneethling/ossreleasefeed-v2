name = "ossreleasefeed-worker"
main = "src/index.ts"
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
workers_dev = true

[vars]
APP_NAME = "ossreleasefeed"

# Secret values are never stored here. Declaring the names makes `wrangler dev`
# read them from the process environment (varlock injects them from 1Password),
# so they are not passed as command-line arguments, which any local process can
# read, and are not written to a .dev.vars file. `wrangler deploy` fails when
# one of these is missing on the deployed Worker. On an existing Worker, set it
# first with `wrangler secret put <NAME>`; a brand-new Worker does not exist yet
# for that command, so deploy it once with `wrangler deploy --secrets-file <path>`
# (JSON or .env format, never committed) and use `secret put` from then on.
[secrets]
required = ["GITHUB_PAT", "TYPESAFE_API_KEY"]

[ai]
binding = "AI"
remote = true

[[flagship]]
binding = "FLAGS"
app_id = "eabc32c1-78e1-4148-8e00-0be4fd5cb1ed"
remote = true

[[ratelimits]]
name = "ASSISTANT_CLIENT_RATE_LIMITER"
namespace_id = "762019481"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "ASSISTANT_NETWORK_RATE_LIMITER"
namespace_id = "762019482"

[ratelimits.simple]
limit = 15
period = 60
